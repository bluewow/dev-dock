<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900">Product History</h1>
      <span id="summary" class="text-sm text-slate-500"></span>
    </div>
  </header>

  <!-- Empty State -->
  <div id="empty" class="hidden max-w-5xl mx-auto px-6 py-20 text-center">
    <div class="text-slate-400 text-5xl mb-4">📋</div>
    <p class="text-slate-500 text-lg">아직 등록된 기능이 없습니다.</p>
    <p class="text-slate-400 text-sm mt-1">Product Team 워크플로우를 통해 기능을 추가하세요.</p>
  </div>

  <!-- Feature List -->
  <main id="features" class="max-w-5xl mx-auto px-6 py-8 space-y-6"></main>

  <script>
    const PHASE_CONFIG = {
      '기획':   { icon: '📝', color: 'blue' },
      '디자인': { icon: '🎨', color: 'purple' },
      '승인':   { icon: '✅', color: 'green' },
      '개발':   { icon: '💻', color: 'indigo' },
      'QA':     { icon: '🧪', color: 'orange' },
    };

    const STATUS_BADGE = {
      '완료':     'bg-emerald-100 text-emerald-700',
      '승인':     'bg-emerald-100 text-emerald-700',
      '조건부승인': 'bg-teal-100 text-teal-700',
      '진행중':   'bg-blue-100 text-blue-700',
      '대기중':   'bg-amber-100 text-amber-700',
      '반려':     'bg-red-100 text-red-700',
      '미시작':   'bg-slate-100 text-slate-500',
    };

    function getStatusBadgeClass(status) {
      return STATUS_BADGE[status] || 'bg-slate-100 text-slate-500';
    }

    function getCurrentStatus(logs) {
      if (!logs || logs.length === 0) return { phase: '-', status: '미시작' };
      return logs[logs.length - 1];
    }

    function getProgress(logs) {
      const phases = ['기획', '디자인', '승인', '개발'];
      const completed = new Set();
      for (const log of logs) {
        if (log.status === '완료' || log.status === '승인' || log.status === '조건부승인') {
          completed.add(log.phase);
        }
      }
      return { done: completed.size, total: phases.length };
    }

    function renderFeature(feature) {
      const current = getCurrentStatus(feature.logs);
      const progress = getProgress(feature.logs);
      const pct = Math.round((progress.done / progress.total) * 100);

      const reviewLinks = (feature.reviews || [])
        .map(r => {
          const name = r.split('/').pop();
          return `<a href="${r}" target="_blank" class="text-primary-600 hover:text-primary-700 underline underline-offset-2 text-sm">${name}</a>`;
        })
        .join(', ');

      const specLink = feature.spec
        ? `<a href="${feature.spec}" target="_blank" class="text-primary-600 hover:text-primary-700 underline underline-offset-2 text-sm">${feature.spec.split('/').pop()}</a>`
        : '<span class="text-slate-400 text-sm">미생성</span>';

      const timelineRows = feature.logs
        .map((log, i) => {
          const cfg = PHASE_CONFIG[log.phase] || { icon: '📌', color: 'slate' };
          const badgeClass = getStatusBadgeClass(log.status);
          const isLast = i === feature.logs.length - 1;
          return `
            <tr class="${isLast ? 'bg-primary-50/50' : ''}">
              <td class="px-4 py-2.5 text-sm text-slate-500 whitespace-nowrap">${log.date}</td>
              <td class="px-4 py-2.5 text-sm whitespace-nowrap">
                <span class="mr-1">${cfg.icon}</span>${log.phase}
              </td>
              <td class="px-4 py-2.5">
                <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${badgeClass}">${log.status}</span>
              </td>
              <td class="px-4 py-2.5 text-sm text-slate-600">${log.note || '-'}</td>
            </tr>`;
        })
        .join('');

      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <!-- Feature Header -->
          <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
              <h2 class="text-lg font-semibold text-slate-900">${feature.name}</h2>
              <span class="text-sm text-slate-400 font-mono">${feature.slug}</span>
            </div>
            <div class="flex items-center gap-4">
              <div class="text-right">
                <span class="inline-block px-2.5 py-1 rounded-full text-xs font-medium ${getStatusBadgeClass(current.status)}">
                  ${current.phase} · ${current.status}
                </span>
              </div>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="px-6 py-3 bg-slate-50 border-b border-slate-100">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500">진행률</span>
              <span class="text-xs font-medium text-slate-700">${pct}%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
              <div class="bg-primary-500 h-2 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>
          </div>

          <!-- Links -->
          <div class="px-6 py-3 border-b border-slate-100 flex gap-6 text-sm">
            <div><span class="text-slate-400 mr-2">Reviews:</span>${reviewLinks || '<span class="text-slate-400">없음</span>'}</div>
            <div><span class="text-slate-400 mr-2">Spec:</span>${specLink}</div>
          </div>

          <!-- Timeline Table -->
          <table class="w-full">
            <thead>
              <tr class="border-b border-slate-100 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                <th class="px-4 py-2.5 w-28">일시</th>
                <th class="px-4 py-2.5 w-24">단계</th>
                <th class="px-4 py-2.5 w-20">상태</th>
                <th class="px-4 py-2.5">비고</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
              ${timelineRows}
            </tbody>
          </table>
        </div>`;
    }

    async function init() {
      try {
        const res = await fetch('history.json');
        const data = await res.json();

        if (data.length === 0) {
          document.getElementById('empty').classList.remove('hidden');
          return;
        }

        const total = data.length;
        const inProgress = data.filter(f => {
          const last = getCurrentStatus(f.logs);
          return last.status === '진행중';
        }).length;

        document.getElementById('summary').textContent = `전체 ${total}개 기능 · ${inProgress}개 진행중`;
        document.getElementById('features').innerHTML = data.map(renderFeature).join('');
      } catch (e) {
        document.getElementById('empty').classList.remove('hidden');
        document.getElementById('empty').querySelector('p').textContent = 'history.json을 불러올 수 없습니다.';
      }
    }

    init();
  </script>

</body>
</html>
